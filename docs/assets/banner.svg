<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Email Waitlist — Multi-tenant email collection microservice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Decorative grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="280"/>
    <line x1="200" y1="40" x2="200" y2="280"/>
    <line x1="320" y1="40" x2="320" y2="280"/>
    <line x1="440" y1="40" x2="440" y2="280"/>
    <line x1="560" y1="40" x2="560" y2="280"/>
    <line x1="680" y1="40" x2="680" y2="280"/>
    <line x1="800" y1="40" x2="800" y2="280"/>
    <line x1="920" y1="40" x2="920" y2="280"/>
    <line x1="1040" y1="40" x2="1040" y2="280"/>
    <line x1="40" y1="100" x2="1160" y2="100"/>
    <line x1="40" y1="180" x2="1160" y2="180"/>
    <line x1="40" y1="260" x2="1160" y2="260"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="980" cy="70" r="90" fill="#60a5fa" opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="250" r="70" fill="#a78bfa" opacity="0.10" filter="url(#glow)"/>

  <!-- Icon -->
  <g transform="translate(72, 96)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="16" y="20" width="40" height="28" rx="6" fill="none" stroke="url(#title)" stroke-width="3"/>
    <path d="M16 24 L36 40 L56 24" fill="none" stroke="url(#title)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="18" r="8" fill="#0d3320" stroke="#34d399" stroke-width="2"/>
    <path d="M51 18 L53.5 20.5 L58 15.5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="168" y="132" fill="url(#title)" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Email Waitlist</text>
  <text x="170" y="176" fill="#9ca3af" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="500">Multi-tenant email collection microservice</text>

  <!-- Pill badges -->
  <g font-family="SF Mono, Consolas, monospace" font-size="13" font-weight="700">
    <rect x="170" y="200" width="56" height="30" rx="15" fill="#0f1d3d" stroke="#1e3a8a"/>
    <text x="198" y="220" fill="#60a5fa" text-anchor="middle">Go</text>

    <rect x="236" y="200" width="110" height="30" rx="15" fill="#0d3320" stroke="#14532d"/>
    <text x="291" y="220" fill="#34d399" text-anchor="middle">PostgreSQL</text>

    <rect x="356" y="200" width="88" height="30" rx="15" fill="#2a1f0d" stroke="#78350f"/>
    <text x="400" y="220" fill="#fbbf24" text-anchor="middle">Resend</text>

    <rect x="454" y="200" width="88" height="30" rx="15" fill="#2d0d2e" stroke="#581c87"/>
    <text x="498" y="220" fill="#c084fc" text-anchor="middle">Docker</text>

    <rect x="552" y="200" width="120" height="30" rx="15" fill="#111827" stroke="#374151"/>
    <text x="612" y="220" fill="#d1d5db" text-anchor="middle">REST API</text>
  </g>

  <!-- Right-side feature chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#d1d5db">
    <rect x="820" y="118" width="300" height="36" rx="10" fill="#111827" stroke="#1f2937"/>
    <text x="840" y="142">Multi-project API keys</text>

    <rect x="820" y="166" width="300" height="36" rx="10" fill="#111827" stroke="#1f2937"/>
    <text x="840" y="190">Rate-limited subscribe endpoint</text>

    <rect x="820" y="214" width="300" height="36" rx="10" fill="#111827" stroke="#1f2937"/>
    <text x="840" y="238">Per-project CORS + email templates</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#accent)"/>
</svg>